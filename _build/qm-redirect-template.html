<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quantum Match</title>
<meta name="description" content="Quantum Match — a fresh match-3 puzzle.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://winsiner.github.io/quantum-match/en/">
{{hreflangBlock}}
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 40px; text-align: center; background: linear-gradient(180deg, #ffe1d6 0%, #c0e0ff 100%); min-height: 100vh; color: #22243d; }
  noscript a { display: inline-block; margin: 8px; padding: 10px 18px; background: #1a1d2e; color: white; border-radius: 12px; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<p style="font-size:20px;font-weight:700;">Quantum Match</p>
<p id="msg" style="color:#5d6280;margin-top:8px;">Loading…</p>
<noscript>
  <p style="color:#5d6280;margin-top:16px;">Choose your language:</p>
  {{noscriptLinks}}
</noscript>
<script>
(function() {
  var SUPPORTED = {{supportedJSON}};
  var DEFAULT_LANG = 'en';
  function pick() {
    try {
      var langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
      for (var i = 0; i < langs.length; i++) {
        var raw = (langs[i] || '').toLowerCase();
        if (!raw) continue;
        if (raw.indexOf('zh-tw') === 0 || raw.indexOf('zh-hk') === 0 || raw.indexOf('zh-mo') === 0 || raw.indexOf('zh-hant') === 0) {
          if (SUPPORTED.indexOf('zh-Hant') >= 0) return 'zh-Hant';
        }
        if (raw.indexOf('zh') === 0) {
          if (SUPPORTED.indexOf('zh-Hans') >= 0) return 'zh-Hans';
        }
        if (raw.indexOf('pt') === 0) {
          if (SUPPORTED.indexOf('pt-BR') >= 0) return 'pt-BR';
        }
        var base = raw.split('-')[0];
        if (SUPPORTED.indexOf(base) >= 0) return base;
        if (SUPPORTED.indexOf(raw) >= 0) return raw;
      }
    } catch (_) {}
    return DEFAULT_LANG;
  }
  var target = pick();
  // Preserve query string + hash (for /?score=N pasted into root by mistake)
  var qs = window.location.search || '';
  var hash = window.location.hash || '';
  window.location.replace('./' + target + '/' + qs + hash);
})();
</script>
</body>
</html>
