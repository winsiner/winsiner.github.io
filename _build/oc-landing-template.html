<!doctype html>
<html lang="{{htmlLang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{metaDesc}}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{ogDesc}}">
<meta property="og:image" content="https://winsiner.github.io/onecolor/og.png">
<meta property="og:url" content="https://winsiner.github.io/onecolor/{{lang}}/">
<meta property="og:locale" content="{{htmlLang}}">
<meta name="twitter:card" content="summary_large_image">

{{hreflangBlock}}

<link rel="icon" href="../icon.png">

<style>
  :root { --bg: #F4F1EA; --ink: #1A1815; --line: #E6E1D6; --muted: #6B655C; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1A1815; --ink: #F4F1EA; --line: #2E2B26; --muted: #9A948A; } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 80px 28px 80px; }
  .hero { text-align: center; margin-bottom: 80px; }
  h1 { font-size: clamp(48px, 11vw, 76px); font-weight: 800; letter-spacing: -2.5px; line-height: 0.98; margin-bottom: 18px; }
  .tag { font-size: 19px; color: var(--muted); margin-bottom: 48px; line-height: 1.5; font-weight: 400; }
  .preview { display: grid; grid-template-columns: repeat(3, 96px); grid-template-rows: repeat(2, 96px); gap: 14px; width: max-content; margin: 0 auto 56px; }
  .preview .block { border-radius: 14px; background: hsl(15 70% 80%); }
  .preview .b5 { background: hsl(18 73% 76%); }
  .stores { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .store-btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px; background: var(--ink); color: var(--bg); text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 16px; transition: transform 0.15s ease; }
  .store-btn:hover { transform: translateY(-1px); }
  .store-btn:active { transform: translateY(1px); }
  section { margin-bottom: 56px; }
  section h2 { font-size: 26px; margin-bottom: 18px; font-weight: 700; letter-spacing: -0.5px; }
  section p { font-size: 17px; line-height: 1.65; color: var(--muted); margin-bottom: 14px; }
  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-top: 24px; }
  .mode { padding: 24px 20px; border: 1px solid var(--line); border-radius: 14px; }
  .mode h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.3px; }
  .mode p { font-size: 14px; line-height: 1.5; color: var(--muted); margin: 0; }
  .features { list-style: none; padding: 0; }
  .features li { padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 16px; line-height: 1.5; color: var(--ink); }
  .features li:last-child { border-bottom: none; }
  .features li b { font-weight: 700; }
  .features li span { color: var(--muted); }
  .lang-switcher { margin-top: 48px; padding: 20px; border-top: 1px solid var(--line); }
  .lang-switcher .label { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; text-align: center; }
  .lang-switcher .links { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .lang-switcher a { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 13px; }
  .lang-switcher a.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  footer { text-align: center; margin-top: 32px; padding-top: 32px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  footer a { color: var(--muted); text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <h1>{{h1}}</h1>
    <p class="tag">{{tag}}</p>

    <div class="preview" aria-hidden="true">
      <div class="block b1"></div>
      <div class="block b2"></div>
      <div class="block b3"></div>
      <div class="block b4"></div>
      <div class="block b5"></div>
      <div class="block b6"></div>
    </div>

    <div class="stores">
      <a class="store-btn" id="ios-btn" href="https://apps.apple.com/app/onecolor/id0000000000" target="_blank" rel="noopener">{{ctaApp}}</a>
      <a class="store-btn" id="android-btn" href="https://play.google.com/store/apps/details?id=com.winsiner.onecolor" target="_blank" rel="noopener">{{ctaPlay}}</a>
    </div>
  </div>

  <section>
    <h2>{{howTitle}}</h2>
    <p>{{howBody}}</p>
  </section>

  <section>
    <h2>{{modesTitle}}</h2>
    <div class="modes">
      {{modesHTML}}
    </div>
  </section>

  <section>
    <h2>{{featuresTitle}}</h2>
    <ul class="features">
      {{featuresHTML}}
    </ul>
  </section>

  <section>
    <h2>{{whyTitle}}</h2>
    <p>{{whyBody}}</p>
  </section>

  <div class="lang-switcher">
    <div class="label">{{langLabel}}</div>
    <div class="links">
      {{langLinksHTML}}
    </div>
  </div>

  <footer>
    <a href="../privacy.html">{{privacyLink}}</a> · <a href="/">winsiner</a> · 2026
  </footer>
</div>

<script>
  (function () {
    var ua = navigator.userAgent || '';
    var isiOS = /iPhone|iPad|iPod/i.test(ua);
    var isAndroid = /Android/i.test(ua);
    if (isiOS) document.getElementById('android-btn').style.opacity = '0.45';
    else if (isAndroid) document.getElementById('ios-btn').style.opacity = '0.45';
  })();
</script>
</body>
</html>
