<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup — Candy</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --r: #ff6b9d;
    --b: #6bb8ff;
    --y: #ffd86b;
    --bg-1: #fff4e6;
    --bg-2: #ffe0f0;
    --ink: #4a2c5a;
    --shadow: rgba(180, 90, 130, 0.25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: 'Fredoka', sans-serif;
    background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color: var(--ink);
    display: grid; place-items: center;
    padding: 24px;
  }
  .phone {
    width: 390px; height: 844px;
    border-radius: 36px;
    background: linear-gradient(170deg, #fff7ea, #ffe4f0);
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(180,90,130,0.3), 0 0 0 6px white;
    position: relative;
    padding: 20px;
    display: flex; flex-direction: column;
  }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 26px;
    background: linear-gradient(90deg, #ff6b9d, #ffd86b, #6bb8ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.5px;
  }
  .menu-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 4px 12px var(--shadow);
    display: grid; place-items: center;
    font-size: 18px;
  }
  .score-card {
    background: white;
    border-radius: 24px;
    padding: 14px 20px;
    box-shadow: 0 8px 24px var(--shadow);
    margin-bottom: 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .score-label { font-size: 11px; color: #b099b8; font-weight: 600; letter-spacing: 1.5px; }
  .score-value {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 36px;
    color: #ff6b9d;
    line-height: 1;
  }
  .score-right { text-align: right; }
  .best-label { font-size: 10px; color: #b099b8; font-weight: 600; letter-spacing: 1px; }
  .best-value { font-family: 'Baloo 2'; font-weight: 700; font-size: 16px; color: #6bb8ff; }
  .next-banner {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; padding: 12px 24px;
    background: white;
    border-radius: 999px;
    box-shadow: 0 6px 16px var(--shadow);
    margin-bottom: 14px;
  }
  .next-label {
    font-size: 11px;
    color: #b099b8;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .next-dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--b);
    box-shadow: 0 0 0 4px rgba(107,184,255,0.25), inset -3px -3px 6px rgba(0,0,0,0.15);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .next-text {
    font-family: 'Baloo 2';
    font-weight: 800;
    font-size: 22px;
    color: var(--b);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.12); }
  }
  .combo-badge {
    position: absolute; top: 200px; right: 24px;
    background: linear-gradient(135deg, #ff6b9d, #ffd86b);
    color: white;
    padding: 10px 16px;
    border-radius: 999px;
    font-family: 'Baloo 2';
    font-weight: 800;
    font-size: 18px;
    box-shadow: 0 8px 24px rgba(255,107,157,0.5);
    transform: rotate(-6deg);
    animation: wiggle 1.8s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-6deg) scale(1); }
    50%      { transform: rotate(-4deg) scale(1.05); }
  }
  .board {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 8px;
    padding: 12px;
    background: white;
    border-radius: 28px;
    box-shadow: inset 0 4px 12px var(--shadow);
    min-height: 0;
  }
  .cell {
    border-radius: 18px;
    position: relative;
    display: grid; place-items: center;
    background: #f5edf3;
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.08), 0 2px 0 rgba(0,0,0,0.05);
  }
  .cell.super::after {
    content: "";
    width: 30%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--pip);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.6), inset -2px -2px 4px rgba(0,0,0,0.2);
  }
  .cell.observed {
    background: var(--obs);
    box-shadow:
      inset -4px -4px 8px rgba(0,0,0,0.18),
      inset 4px 4px 8px rgba(255,255,255,0.4),
      0 4px 12px var(--obs-shadow);
    animation: bounce 0.6s ease-in-out infinite alternate;
  }
  .cell.observed[data-color="r"] { --obs: var(--r); --obs-shadow: rgba(255,107,157,0.4); }
  .cell.observed[data-color="b"] { --obs: var(--b); --obs-shadow: rgba(107,184,255,0.4); }
  .cell.observed[data-color="y"] { --obs: var(--y); --obs-shadow: rgba(255,216,107,0.4); }
  @keyframes bounce {
    from { transform: scale(1); }
    to   { transform: scale(1.04); }
  }
  .cell.picks-next {
    box-shadow:
      inset 0 3px 6px rgba(0,0,0,0.08),
      0 0 0 3px var(--b),
      0 0 20px rgba(107,184,255,0.5);
  }
  .cell.picks-next::after {
    animation: pickPulse 0.8s ease-in-out infinite alternate;
  }
  @keyframes pickPulse {
    from { transform: scale(1); }
    to   { transform: scale(1.3); }
  }
  .popup {
    position: absolute;
    top: 320px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Baloo 2';
    font-weight: 800;
    font-size: 48px;
    background: linear-gradient(180deg, #fff, #ffd86b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 4px 12px rgba(255,180,80,0.5);
    letter-spacing: -2px;
    pointer-events: none;
    animation: popupFloat 2s ease-in-out infinite;
  }
  @keyframes popupFloat {
    0%, 100% { transform: translateX(-50%) translateY(0) scale(1); }
    50%      { transform: translateX(-50%) translateY(-10px) scale(1.05); }
  }
  .footer-stats {
    display: flex; justify-content: space-around;
    margin-top: 12px;
    padding: 8px;
  }
  .stat-pill {
    background: white;
    border-radius: 16px;
    padding: 6px 14px;
    box-shadow: 0 3px 8px var(--shadow);
    font-family: 'Fredoka';
    font-size: 12px;
    font-weight: 600;
  }
  .stat-pill b { color: #ff6b9d; font-size: 14px; }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="title">Quantum Pop!</div>
    <div class="menu-btn">☰</div>
  </div>
  <div class="score-card">
    <div>
      <div class="score-label">SCORE</div>
      <div class="score-value">1,240</div>
    </div>
    <div class="score-right">
      <div class="best-label">BEST</div>
      <div class="best-value">5,820</div>
    </div>
  </div>
  <div class="next-banner">
    <span class="next-label">NEXT</span>
    <span class="next-dot"></span>
    <span class="next-text">BLUE</span>
  </div>
  <div class="board" id="board"></div>
  <div class="combo-badge">x4 COMBO 🔥</div>
  <div class="popup">+90!</div>
  <div class="footer-stats">
    <div class="stat-pill">관측 <b>23</b></div>
    <div class="stat-pill">매치 <b>8</b></div>
  </div>
</div>
<script>
  const state = [
    'sR','sB','oY','oY','oY',
    'sB','sB','sB','sR','sY',
    'oR','sB','sR','sY','sB',
    'sB','sR','sB','oR','sB',
    'sY','sB','sR','sB','sR',
  ];
  const board = document.getElementById('board');
  const pip = { R: 'var(--r)', B: 'var(--b)', Y: 'var(--y)' };
  state.forEach(s => {
    const c = document.createElement('div');
    c.className = 'cell';
    const kind = s[0], color = s[1];
    if (kind === 's') {
      c.classList.add('super');
      c.style.setProperty('--pip', pip[color]);
      if (color === 'B') c.classList.add('picks-next');
    } else {
      c.classList.add('observed');
      c.dataset.color = color.toLowerCase();
    }
    board.appendChild(c);
  });
</script>
</body>
</html>
