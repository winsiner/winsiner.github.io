<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup — Mascot</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Baloo+2:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --r: #ff6b8b;
    --b: #5fb3ff;
    --y: #ffce5a;
    --bg-1: #fff4d9;
    --bg-2: #ffe0e8;
    --ink: #443322;
    --shadow: rgba(140, 80, 80, 0.2);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: 'Fredoka', sans-serif;
    background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color: var(--ink);
    display: grid; place-items: center;
    padding: 24px;
  }
  .phone {
    width: 390px; height: 844px;
    border-radius: 38px;
    background: linear-gradient(170deg, #fffaee, #ffeae6);
    overflow: hidden;
    position: relative;
    padding: 20px;
    display: flex; flex-direction: column;
    box-shadow: 0 30px 80px var(--shadow), 0 0 0 5px white;
  }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .title-wrap { display: flex; align-items: center; gap: 8px; }
  .title-icons { display: flex; gap: -4px; }
  .icon-mini {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 14px; font-weight: 900;
    color: white;
    border: 2px solid white;
    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
    margin-left: -8px;
  }
  .icon-mini:first-child { margin-left: 0; background: var(--r); }
  .icon-mini:nth-child(2) { background: var(--b); }
  .icon-mini:nth-child(3) { background: var(--y); color: var(--ink); }
  .title {
    font-family: 'Baloo 2';
    font-weight: 900;
    font-size: 22px;
    background: linear-gradient(90deg, var(--r), var(--y));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .menu-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 4px 12px var(--shadow);
    display: grid; place-items: center;
    font-size: 18px;
  }
  .score-card {
    background: white;
    border-radius: 22px;
    padding: 14px 18px;
    box-shadow: 0 8px 20px var(--shadow);
    margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .score-label { font-size: 10px; color: #b89890; font-weight: 700; letter-spacing: 1.5px; }
  .score-value {
    font-family: 'Baloo 2';
    font-weight: 900;
    font-size: 32px;
    color: var(--r);
    line-height: 1;
  }
  .best-value { font-family: 'Baloo 2'; font-weight: 800; font-size: 16px; color: var(--b); text-align: right; }
  .best-label { font-size: 9px; color: #b89890; font-weight: 700; letter-spacing: 1px; text-align: right; }
  .next-banner {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; padding: 10px 18px;
    background: white;
    border-radius: 999px;
    box-shadow: 0 6px 14px var(--shadow);
    margin-bottom: 10px;
  }
  .next-label { font-size: 10px; color: #b89890; font-weight: 700; letter-spacing: 2px; }
  /* Mascot character — eyes + smile */
  .mascot {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--b);
    position: relative;
    box-shadow: 0 4px 0 #4090d8, 0 6px 12px rgba(70,130,200,0.4);
    animation: hop 1.2s ease-in-out infinite;
  }
  @keyframes hop {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }
  .mascot::before, .mascot::after {
    content: "";
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: white;
    top: 11px;
  }
  .mascot::before { left: 9px; }
  .mascot::after { right: 9px; }
  .mascot-mouth {
    position: absolute;
    bottom: 9px; left: 50%;
    transform: translateX(-50%);
    width: 10px; height: 6px;
    border-radius: 0 0 10px 10px;
    background: #333;
  }
  .next-text { font-family: 'Baloo 2'; font-weight: 800; font-size: 18px; color: var(--b); }
  .combo-badge {
    position: absolute; top: 210px; right: 20px;
    background: white;
    padding: 6px 10px 6px 6px;
    border-radius: 999px;
    box-shadow: 0 6px 16px rgba(255,107,139,0.4);
    display: flex; align-items: center; gap: 6px;
    transform: rotate(-6deg);
    z-index: 5;
  }
  .combo-mascot {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--r);
    position: relative;
    box-shadow: 0 2px 0 #d04060;
    flex-shrink: 0;
  }
  .combo-mascot::before, .combo-mascot::after {
    content: "";
    position: absolute;
    width: 5px; height: 7px;
    background: white;
    border-radius: 50%;
    top: 8px;
  }
  .combo-mascot::before { left: 7px; transform: rotate(-15deg); }
  .combo-mascot::after { right: 7px; transform: rotate(15deg); }
  .combo-mascot-mouth {
    position: absolute;
    bottom: 7px; left: 50%;
    transform: translateX(-50%);
    width: 12px; height: 6px;
    border-radius: 0 0 12px 12px;
    background: #333;
  }
  .combo-text {
    font-family: 'Baloo 2';
    font-weight: 900;
    font-size: 16px;
    color: var(--r);
    letter-spacing: -0.5px;
  }
  .speech-bubble {
    position: absolute;
    top: 50px; left: 14px;
    background: white;
    padding: 8px 14px;
    border-radius: 16px 16px 16px 4px;
    box-shadow: 0 4px 12px var(--shadow);
    font-family: 'Baloo 2';
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
    z-index: 6;
    transform: rotate(-3deg);
  }
  .speech-bubble::after {
    content: "";
    position: absolute;
    bottom: -8px; left: 18px;
    width: 0; height: 0;
    border-top: 12px solid white;
    border-right: 8px solid transparent;
  }
  .board {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 6px;
    padding: 12px;
    background: white;
    border-radius: 26px;
    box-shadow: inset 0 4px 10px var(--shadow);
    min-height: 0;
  }
  .cell {
    border-radius: 16px;
    position: relative;
    display: grid; place-items: center;
    background: #f8f0ea;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
  }
  .cell.super::after {
    content: "";
    width: 50%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--pip);
    box-shadow: 0 3px 0 var(--pip-dark), 0 5px 8px rgba(0,0,0,0.15);
  }
  .cell.super[style*="--pip: var(--r)"] { --pip-dark: #d04060; }
  .cell.super[style*="--pip: var(--b)"] { --pip-dark: #4090d8; }
  .cell.super[style*="--pip: var(--y)"] { --pip-dark: #d8a030; }
  /* Tiny face pips on super cells */
  .cell.super .face {
    position: absolute;
    top: 50%; left: 50%;
    width: 50%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 3;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-content: center;
    justify-items: center;
    gap: 4px;
    padding-top: 25%;
  }
  .cell.super .face::before, .cell.super .face::after {
    content: "";
    width: 3px; height: 5px;
    background: white;
    border-radius: 50%;
  }
  .cell.observed {
    background: var(--obs);
    box-shadow:
      0 4px 0 var(--obs-dark),
      0 6px 12px var(--obs-shadow);
  }
  .cell.observed[data-color="r"] { --obs: var(--r); --obs-dark: #d04060; --obs-shadow: rgba(255,107,139,0.5); }
  .cell.observed[data-color="b"] { --obs: var(--b); --obs-dark: #4090d8; --obs-shadow: rgba(95,179,255,0.5); }
  .cell.observed[data-color="y"] { --obs: var(--y); --obs-dark: #d8a030; --obs-shadow: rgba(255,206,90,0.5); }
  /* Observed cells get full face */
  .cell.observed::before {
    content: "◠ ◠";
    position: absolute;
    top: 30%;
    color: white;
    font-size: 12px;
    letter-spacing: 4px;
    font-weight: 900;
  }
  .cell.observed::after {
    content: "";
    width: 30%;
    height: 12%;
    background: white;
    border-radius: 0 0 999px 999px;
    margin-top: 10%;
  }
  .cell.observed[data-color="y"]::before { color: var(--ink); }
  .cell.observed[data-color="y"]::after { background: var(--ink); }
  .cell.picks-next {
    box-shadow:
      0 0 0 3px var(--b),
      0 0 20px rgba(95,179,255,0.5),
      inset 0 2px 4px rgba(0,0,0,0.08);
    animation: pickBounce 0.7s ease-in-out infinite alternate;
  }
  @keyframes pickBounce {
    from { transform: translateY(0); }
    to   { transform: translateY(-4px); }
  }
  .popup {
    position: absolute;
    top: 340px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Baloo 2';
    font-weight: 900;
    font-size: 56px;
    background: linear-gradient(180deg, var(--y), var(--r));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 4px 8px rgba(255,180,80,0.3);
    letter-spacing: -2px;
    pointer-events: none;
    z-index: 5;
  }
  .footer-stats { display: flex; justify-content: space-around; margin-top: 10px; }
  .stat-pill {
    background: white;
    border-radius: 14px;
    padding: 6px 12px;
    box-shadow: 0 3px 8px var(--shadow);
    font-family: 'Fredoka';
    font-size: 12px;
    font-weight: 600;
  }
  .stat-pill b { color: var(--r); font-size: 14px; font-weight: 800; }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="title-wrap">
      <div class="title-icons">
        <span class="icon-mini">R</span>
        <span class="icon-mini">B</span>
        <span class="icon-mini">Y</span>
      </div>
      <div class="title">Trio!</div>
    </div>
    <div class="menu-btn">☰</div>
  </div>
  <div class="score-card">
    <div>
      <div class="score-label">SCORE</div>
      <div class="score-value">1,240</div>
    </div>
    <div>
      <div class="best-label">BEST</div>
      <div class="best-value">5,820</div>
    </div>
  </div>
  <div class="next-banner">
    <span class="next-label">NEXT</span>
    <div class="mascot"><div class="mascot-mouth"></div></div>
    <span class="next-text">BLUE-BLUE!</span>
  </div>
  <div class="speech-bubble">Blue 3개 만들어줘! 💙</div>
  <div class="board" id="board"></div>
  <div class="combo-badge">
    <div class="combo-mascot"><div class="combo-mascot-mouth"></div></div>
    <div class="combo-text">×4 콤보!</div>
  </div>
  <div class="popup">+90 야호!</div>
  <div class="footer-stats">
    <div class="stat-pill">관측 <b>23</b></div>
    <div class="stat-pill">매치 <b>8</b></div>
  </div>
</div>
<script>
  const state = [
    'sR','sB','oY','oY','oY',
    'sB','sB','sB','sR','sY',
    'oR','sB','sR','sY','sB',
    'sB','sR','sB','oR','sB',
    'sY','sB','sR','sB','sR',
  ];
  const board = document.getElementById('board');
  const pip = { R: 'var(--r)', B: 'var(--b)', Y: 'var(--y)' };
  state.forEach(s => {
    const c = document.createElement('div');
    c.className = 'cell';
    const kind = s[0], color = s[1];
    if (kind === 's') {
      c.classList.add('super');
      c.style.setProperty('--pip', pip[color]);
      const face = document.createElement('div');
      face.className = 'face';
      c.appendChild(face);
      if (color === 'B') c.classList.add('picks-next');
    } else {
      c.classList.add('observed');
      c.dataset.color = color.toLowerCase();
    }
    board.appendChild(c);
  });
</script>
</body>
</html>
