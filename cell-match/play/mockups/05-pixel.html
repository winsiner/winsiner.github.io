<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup — Pixel 8-bit</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --r: #ff3050;
    --b: #4080ff;
    --y: #ffd040;
    --bg: #1a1a2e;
    --panel: #2d2d54;
    --shadow: #0a0a1a;
    --ink: #f0f0ff;
  }
  * { box-sizing: border-box; image-rendering: pixelated; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: 'VT323', monospace;
    background: var(--bg);
    color: var(--ink);
    display: grid; place-items: center;
    padding: 24px;
    image-rendering: pixelated;
  }
  /* Faux scanlines */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent 0 2px,
      rgba(0,0,0,0.15) 2px 4px
    );
    pointer-events: none;
    z-index: 100;
  }
  .phone {
    width: 390px; height: 844px;
    background: var(--bg);
    overflow: hidden;
    position: relative;
    padding: 16px;
    display: flex; flex-direction: column;
    border: 4px solid var(--ink);
    box-shadow:
      8px 8px 0 var(--shadow),
      inset -4px -4px 0 rgba(0,0,0,0.4),
      inset 4px 4px 0 rgba(255,255,255,0.1);
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel);
    padding: 10px 14px;
    border: 3px solid var(--ink);
    margin-bottom: 12px;
    box-shadow: 4px 4px 0 var(--shadow);
  }
  .title {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: var(--y);
    letter-spacing: 1px;
    text-shadow: 2px 2px 0 var(--shadow);
  }
  .menu-btn {
    font-family: 'Press Start 2P';
    font-size: 10px;
    color: var(--ink);
    background: var(--bg);
    border: 2px solid var(--ink);
    padding: 4px 8px;
    box-shadow: 2px 2px 0 var(--shadow);
  }
  .score-card {
    background: var(--panel);
    border: 3px solid var(--ink);
    padding: 10px 14px;
    margin-bottom: 12px;
    box-shadow: 4px 4px 0 var(--shadow);
  }
  .score-label {
    font-family: 'Press Start 2P';
    font-size: 9px;
    color: var(--y);
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .score-value {
    font-family: 'Press Start 2P';
    font-size: 22px;
    color: var(--ink);
    text-shadow: 3px 3px 0 var(--shadow);
    line-height: 1;
  }
  .score-row { display: flex; justify-content: space-between; align-items: flex-end; }
  .best { font-family: 'Press Start 2P'; font-size: 8px; color: var(--b); letter-spacing: 1px; }
  .next-banner {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 10px;
    background: var(--panel);
    border: 3px solid var(--ink);
    margin-bottom: 12px;
    box-shadow: 4px 4px 0 var(--shadow);
  }
  .next-label {
    font-family: 'Press Start 2P';
    font-size: 9px;
    color: var(--y);
  }
  .next-dot {
    width: 18px; height: 18px;
    background: var(--b);
    border: 2px solid var(--ink);
    image-rendering: pixelated;
    animation: blink 0.6s steps(1) infinite;
  }
  @keyframes blink {
    0%, 50% { background: var(--b); }
    51%, 100% { background: var(--ink); }
  }
  .next-text {
    font-family: 'Press Start 2P';
    font-size: 11px;
    color: var(--b);
    letter-spacing: 1px;
  }
  .combo-badge {
    position: absolute; top: 240px; right: 20px;
    padding: 6px 10px;
    background: var(--y);
    color: var(--shadow);
    font-family: 'Press Start 2P';
    font-size: 11px;
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--shadow);
    z-index: 5;
    letter-spacing: 1px;
  }
  .board {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 4px;
    padding: 8px;
    background: var(--panel);
    border: 3px solid var(--ink);
    min-height: 0;
    box-shadow: 4px 4px 0 var(--shadow), inset 2px 2px 0 rgba(0,0,0,0.4);
  }
  .cell {
    background: var(--bg);
    border: 2px solid var(--ink);
    position: relative;
    display: grid; place-items: center;
    box-shadow: inset -2px -2px 0 rgba(0,0,0,0.4), inset 2px 2px 0 rgba(255,255,255,0.1);
  }
  /* Pixelated "pip" via clip-path stairs */
  .cell.super::after {
    content: "";
    width: 50%;
    height: 50%;
    background: var(--pip);
    image-rendering: pixelated;
    box-shadow:
      inset -2px -2px 0 rgba(0,0,0,0.4),
      inset 2px 2px 0 rgba(255,255,255,0.3);
  }
  .cell.observed {
    background: var(--obs);
    box-shadow:
      inset -3px -3px 0 rgba(0,0,0,0.4),
      inset 3px 3px 0 rgba(255,255,255,0.3);
  }
  .cell.observed[data-color="r"] { --obs: var(--r); }
  .cell.observed[data-color="b"] { --obs: var(--b); }
  .cell.observed[data-color="y"] { --obs: var(--y); }
  .cell.picks-next {
    border-color: var(--b);
    border-width: 3px;
    animation: pickFlash 0.4s steps(1) infinite;
  }
  @keyframes pickFlash {
    0%, 50% { border-color: var(--b); }
    51%, 100% { border-color: var(--ink); }
  }
  .popup {
    position: absolute;
    top: 360px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Press Start 2P';
    font-size: 32px;
    color: var(--y);
    text-shadow:
      4px 4px 0 var(--r),
      8px 8px 0 var(--shadow);
    letter-spacing: 2px;
    pointer-events: none;
    z-index: 5;
    animation: popupBounce 0.4s steps(2) infinite alternate;
  }
  @keyframes popupBounce {
    from { transform: translateX(-50%) translateY(0); }
    to   { transform: translateX(-50%) translateY(-4px); }
  }
  .footer-stats {
    display: flex; justify-content: space-between;
    margin-top: 12px; padding: 8px;
    background: var(--panel);
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--shadow);
  }
  .stat-pill {
    font-family: 'Press Start 2P';
    font-size: 9px;
    color: var(--ink);
    letter-spacing: 1px;
  }
  .stat-pill b { color: var(--y); }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="title">QUANTUM STACK</div>
    <div class="menu-btn">MENU</div>
  </div>
  <div class="score-card">
    <div class="score-label">★ SCORE</div>
    <div class="score-row">
      <div class="score-value">001240</div>
      <div class="best">HI 5820</div>
    </div>
  </div>
  <div class="next-banner">
    <span class="next-label">NEXT</span>
    <span class="next-dot"></span>
    <span class="next-text">BLUE</span>
  </div>
  <div class="board" id="board"></div>
  <div class="combo-badge">x4!!</div>
  <div class="popup">+90</div>
  <div class="footer-stats">
    <div class="stat-pill">OBS <b>023</b></div>
    <div class="stat-pill">MATCH <b>008</b></div>
    <div class="stat-pill">LV <b>04</b></div>
  </div>
</div>
<script>
  const state = [
    'sR','sB','oY','oY','oY',
    'sB','sB','sB','sR','sY',
    'oR','sB','sR','sY','sB',
    'sB','sR','sB','oR','sB',
    'sY','sB','sR','sB','sR',
  ];
  const board = document.getElementById('board');
  const pip = { R: 'var(--r)', B: 'var(--b)', Y: 'var(--y)' };
  state.forEach(s => {
    const c = document.createElement('div');
    c.className = 'cell';
    const kind = s[0], color = s[1];
    if (kind === 's') {
      c.classList.add('super');
      c.style.setProperty('--pip', pip[color]);
      if (color === 'B') c.classList.add('picks-next');
    } else {
      c.classList.add('observed');
      c.dataset.color = color.toLowerCase();
    }
    board.appendChild(c);
  });
</script>
</body>
</html>
