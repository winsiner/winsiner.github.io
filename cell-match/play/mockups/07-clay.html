<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup — Clay 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --r: #ff8a95;
    --b: #88b8ff;
    --y: #ffd97a;
    --bg-1: #f0e6dc;
    --bg-2: #e8d8c8;
    --ink: #5a3a3a;
    --shadow: rgba(120, 70, 70, 0.2);
    --soft: #d8c8b8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: 'Nunito', sans-serif;
    background:
      radial-gradient(circle at 30% 20%, #fff5ea, transparent 50%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color: var(--ink);
    display: grid; place-items: center;
    padding: 24px;
    min-height: 100vh;
  }
  .phone {
    width: 390px; height: 844px;
    border-radius: 48px;
    background:
      radial-gradient(circle at 20% 0%, #fff8ee, transparent 50%),
      linear-gradient(160deg, #f5ebe1, #e8d8c8);
    overflow: hidden;
    position: relative;
    padding: 24px;
    display: flex; flex-direction: column;
    box-shadow:
      0 30px 80px rgba(120,70,70,0.3),
      inset -8px -8px 16px rgba(120,70,70,0.1),
      inset 8px 8px 16px rgba(255,255,255,0.8);
  }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .title {
    font-weight: 900;
    font-size: 24px;
    color: var(--ink);
    letter-spacing: -0.5px;
  }
  .title-sub {
    display: block;
    font-weight: 600;
    font-size: 11px;
    color: #a08080;
    margin-top: 2px;
  }
  .menu-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--bg-2);
    color: var(--ink);
    display: grid; place-items: center;
    font-size: 18px;
    font-weight: 800;
    box-shadow:
      6px 6px 12px var(--shadow),
      -4px -4px 12px rgba(255,255,255,0.8),
      inset 1px 1px 2px rgba(255,255,255,0.5),
      inset -1px -1px 2px rgba(120,70,70,0.1);
  }
  .score-card {
    padding: 18px 22px;
    background: var(--bg-1);
    border-radius: 28px;
    margin-bottom: 14px;
    box-shadow:
      10px 10px 24px var(--shadow),
      -6px -6px 18px rgba(255,255,255,0.8),
      inset 2px 2px 4px rgba(255,255,255,0.6),
      inset -2px -2px 4px rgba(120,70,70,0.05);
  }
  .score-label {
    font-size: 11px;
    color: #b89890;
    letter-spacing: 2.5px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .score-value {
    font-weight: 900;
    font-size: 44px;
    color: var(--ink);
    line-height: 1;
    letter-spacing: -1.5px;
    margin-top: 4px;
    text-shadow:
      2px 2px 4px rgba(120,70,70,0.15),
      -1px -1px 2px rgba(255,255,255,0.6);
  }
  .score-row { display: flex; justify-content: space-between; align-items: flex-end; }
  .best { color: #b89890; font-size: 13px; font-weight: 700; }
  .best b { color: var(--ink); }
  .next-banner {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 14px;
    background: var(--bg-1);
    border-radius: 999px;
    margin-bottom: 14px;
    box-shadow:
      8px 8px 20px var(--shadow),
      -4px -4px 14px rgba(255,255,255,0.8),
      inset 2px 2px 4px rgba(255,255,255,0.6);
  }
  .next-label {
    font-size: 11px;
    color: #b89890;
    letter-spacing: 3px;
    font-weight: 700;
  }
  .next-dot {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #cce0ff, var(--b));
    box-shadow:
      4px 4px 8px rgba(70,110,170,0.4),
      -2px -2px 4px rgba(255,255,255,0.5),
      inset 2px 2px 4px rgba(255,255,255,0.5),
      inset -2px -2px 4px rgba(70,110,170,0.4);
    animation: bob 2.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-3px) scale(1.05); }
  }
  .next-text {
    font-weight: 800;
    font-size: 16px;
    color: var(--b);
    letter-spacing: 1px;
  }
  .combo-badge {
    position: absolute; top: 240px; right: 28px;
    padding: 10px 18px;
    background: linear-gradient(135deg, var(--y), #ffa580);
    color: white;
    font-weight: 900;
    font-size: 16px;
    border-radius: 999px;
    box-shadow:
      8px 8px 20px rgba(255,180,80,0.5),
      inset 2px 2px 4px rgba(255,255,255,0.4),
      inset -2px -2px 4px rgba(180,120,60,0.3);
    transform: rotate(-6deg);
    z-index: 5;
    letter-spacing: 0.5px;
  }
  .board {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 8px;
    padding: 16px;
    background: var(--bg-1);
    border-radius: 32px;
    box-shadow:
      inset 8px 8px 16px var(--shadow),
      inset -8px -8px 16px rgba(255,255,255,0.8);
    min-height: 0;
  }
  .cell {
    background: var(--bg-2);
    border-radius: 18px;
    position: relative;
    display: grid; place-items: center;
    box-shadow:
      inset 4px 4px 8px var(--shadow),
      inset -4px -4px 8px rgba(255,255,255,0.6);
  }
  .cell.super::after {
    content: "";
    width: 38%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.7), var(--pip));
    box-shadow:
      4px 4px 8px var(--pip-shadow),
      -2px -2px 4px rgba(255,255,255,0.5),
      inset 2px 2px 4px rgba(255,255,255,0.5),
      inset -2px -2px 4px rgba(0,0,0,0.15);
  }
  .cell.super[style*="--pip: var(--r)"] { --pip-shadow: rgba(255,138,149,0.5); }
  .cell.super[style*="--pip: var(--b)"] { --pip-shadow: rgba(136,184,255,0.5); }
  .cell.super[style*="--pip: var(--y)"] { --pip-shadow: rgba(255,217,122,0.5); }
  .cell.observed {
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5), var(--obs));
    box-shadow:
      6px 6px 14px var(--obs-shadow),
      -3px -3px 8px rgba(255,255,255,0.4),
      inset 3px 3px 6px rgba(255,255,255,0.5),
      inset -3px -3px 6px rgba(0,0,0,0.18);
  }
  .cell.observed[data-color="r"] { --obs: var(--r); --obs-shadow: rgba(255,138,149,0.4); }
  .cell.observed[data-color="b"] { --obs: var(--b); --obs-shadow: rgba(136,184,255,0.4); }
  .cell.observed[data-color="y"] { --obs: var(--y); --obs-shadow: rgba(255,217,122,0.4); }
  .cell.picks-next {
    box-shadow:
      inset 0 0 0 3px var(--b),
      0 0 20px rgba(136,184,255,0.5),
      inset 4px 4px 8px rgba(120,70,70,0.1);
  }
  .cell.picks-next::after {
    animation: clayPulse 1.4s ease-in-out infinite;
  }
  @keyframes clayPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.15); }
  }
  .popup {
    position: absolute;
    top: 360px; left: 50%;
    transform: translateX(-50%) rotate(-4deg);
    font-weight: 900;
    font-size: 64px;
    color: var(--y);
    text-shadow:
      4px 4px 0 #d4a050,
      6px 6px 12px rgba(180,120,60,0.4);
    letter-spacing: -2px;
    pointer-events: none;
    z-index: 5;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.15));
  }
  .footer-stats { display: flex; justify-content: space-between; margin-top: 14px; padding: 0 4px; }
  .stat-pill {
    padding: 8px 16px;
    background: var(--bg-1);
    border-radius: 999px;
    font-size: 12px;
    color: #b89890;
    font-weight: 700;
    box-shadow:
      4px 4px 10px var(--shadow),
      -2px -2px 6px rgba(255,255,255,0.7);
  }
  .stat-pill b { color: var(--ink); font-weight: 900; }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div>
      <div class="title">Quantum Stack</div>
      <div class="title-sub">소프트하게 관측해보세요</div>
    </div>
    <div class="menu-btn">≡</div>
  </div>
  <div class="score-card">
    <div class="score-label">Score</div>
    <div class="score-row">
      <div class="score-value">1,240</div>
      <div class="best">best <b>5,820</b></div>
    </div>
  </div>
  <div class="next-banner">
    <span class="next-label">NEXT</span>
    <span class="next-dot"></span>
    <span class="next-text">BLUE</span>
  </div>
  <div class="board" id="board"></div>
  <div class="combo-badge">×4 NICE!</div>
  <div class="popup">+90</div>
  <div class="footer-stats">
    <div class="stat-pill">관측 <b>23</b></div>
    <div class="stat-pill">매치 <b>8</b></div>
    <div class="stat-pill">콤보 <b>×4</b></div>
  </div>
</div>
<script>
  const state = [
    'sR','sB','oY','oY','oY',
    'sB','sB','sB','sR','sY',
    'oR','sB','sR','sY','sB',
    'sB','sR','sB','oR','sB',
    'sY','sB','sR','sB','sR',
  ];
  const board = document.getElementById('board');
  const pip = { R: 'var(--r)', B: 'var(--b)', Y: 'var(--y)' };
  state.forEach(s => {
    const c = document.createElement('div');
    c.className = 'cell';
    const kind = s[0], color = s[1];
    if (kind === 's') {
      c.classList.add('super');
      c.style.setProperty('--pip', pip[color]);
      if (color === 'B') c.classList.add('picks-next');
    } else {
      c.classList.add('observed');
      c.dataset.color = color.toLowerCase();
    }
    board.appendChild(c);
  });
</script>
</body>
</html>
