<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup — Liquid Glass</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --r: #ff5970;
    --b: #4ea8ff;
    --y: #ffd24d;
    --ink: rgba(255,255,255,0.95);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(ellipse at 20% 30%, #ff5970 0%, transparent 40%),
      radial-gradient(ellipse at 80% 70%, #4ea8ff 0%, transparent 40%),
      radial-gradient(ellipse at 50% 90%, #ffd24d 0%, transparent 35%),
      linear-gradient(180deg, #1a1a3e, #0a0a20);
    color: var(--ink);
    display: grid; place-items: center;
    padding: 24px;
    min-height: 100vh;
  }
  /* Floating blurred orbs in background */
  body::before, body::after {
    content: "";
    position: fixed;
    width: 400px; height: 400px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    pointer-events: none;
  }
  body::before { background: var(--r); top: 10%; left: -10%; }
  body::after  { background: var(--b); bottom: 10%; right: -10%; }
  .phone {
    width: 390px; height: 844px;
    border-radius: 44px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.15);
    overflow: hidden;
    position: relative;
    padding: 22px;
    display: flex; flex-direction: column;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.2),
      inset 0 -1px 0 rgba(0,0,0,0.2);
  }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .title {
    font-weight: 900;
    font-size: 20px;
    letter-spacing: -0.5px;
    color: white;
  }
  .title-sub {
    display: block;
    font-weight: 300;
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 2px;
    margin-top: 2px;
    text-transform: uppercase;
  }
  .menu-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    display: grid; place-items: center;
    color: white; font-size: 16px;
    backdrop-filter: blur(20px);
  }
  .score-card {
    padding: 18px 22px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    margin-bottom: 14px;
    backdrop-filter: blur(20px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .score-label {
    font-size: 10px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
    font-weight: 500;
    text-transform: uppercase;
  }
  .score-value {
    font-weight: 900;
    font-size: 44px;
    color: white;
    line-height: 1;
    letter-spacing: -2px;
    margin-top: 2px;
  }
  .score-row { display: flex; justify-content: space-between; align-items: flex-end; }
  .best {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    font-weight: 500;
  }
  .best b { color: white; font-weight: 900; }
  .next-banner {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 12px;
    background: rgba(78,168,255,0.12);
    border: 1px solid rgba(78,168,255,0.3);
    border-radius: 999px;
    margin-bottom: 14px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 30px rgba(78,168,255,0.2);
  }
  .next-label {
    font-size: 10px;
    color: rgba(255,255,255,0.6);
    letter-spacing: 3px;
    font-weight: 500;
  }
  .next-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, white, var(--b));
    box-shadow: 0 0 16px var(--b);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 16px var(--b); }
    50%      { transform: scale(1.15); box-shadow: 0 0 24px var(--b); }
  }
  .next-text {
    font-weight: 700;
    font-size: 14px;
    color: white;
    letter-spacing: 1px;
  }
  .combo-badge {
    position: absolute; top: 230px; right: 26px;
    padding: 8px 16px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px;
    backdrop-filter: blur(20px);
    color: white;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    z-index: 4;
  }
  .combo-badge b { color: var(--y); font-weight: 900; font-size: 16px; }
  .board {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 6px;
    padding: 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 28px;
    backdrop-filter: blur(30px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.2),
      0 20px 40px rgba(0,0,0,0.3);
    min-height: 0;
  }
  .cell {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    position: relative;
    display: grid; place-items: center;
    backdrop-filter: blur(10px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .cell.super::after {
    content: "";
    width: 28%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), var(--pip));
    box-shadow: 0 0 12px var(--pip), inset 0 1px 2px rgba(255,255,255,0.6);
  }
  .cell.observed {
    background: linear-gradient(135deg, var(--obs), var(--obs-light));
    border-color: rgba(255,255,255,0.3);
    box-shadow:
      0 0 20px var(--obs-glow),
      inset 0 1px 0 rgba(255,255,255,0.4),
      inset 0 -1px 0 rgba(0,0,0,0.2);
  }
  .cell.observed[data-color="r"] { --obs: var(--r); --obs-light: #ff8a9c; --obs-glow: rgba(255,89,112,0.5); }
  .cell.observed[data-color="b"] { --obs: var(--b); --obs-light: #7bbeff; --obs-glow: rgba(78,168,255,0.5); }
  .cell.observed[data-color="y"] { --obs: var(--y); --obs-light: #ffe080; --obs-glow: rgba(255,210,77,0.5); }
  .cell.picks-next {
    box-shadow:
      0 0 0 2px var(--b),
      0 0 24px var(--b),
      inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .cell.picks-next::after {
    animation: pickPulse 1.4s ease-in-out infinite;
  }
  @keyframes pickPulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50%      { transform: scale(1.2); opacity: 1; }
  }
  .popup {
    position: absolute;
    top: 360px; left: 50%;
    transform: translateX(-50%);
    font-weight: 900;
    font-size: 64px;
    color: white;
    letter-spacing: -3px;
    pointer-events: none;
    z-index: 5;
    text-shadow: 0 8px 40px rgba(78,168,255,0.6);
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  }
  .footer-stats { display: flex; justify-content: space-between; margin-top: 14px; }
  .stat-pill {
    padding: 6px 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1px;
    backdrop-filter: blur(10px);
    font-weight: 500;
  }
  .stat-pill b { color: white; font-weight: 700; }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div>
      <div class="title">Quantum Stack</div>
      <div class="title-sub">superposition · collapse</div>
    </div>
    <div class="menu-btn">⋯</div>
  </div>
  <div class="score-card">
    <div class="score-label">SCORE</div>
    <div class="score-row">
      <div class="score-value">1,240</div>
      <div class="best">best <b>5,820</b></div>
    </div>
  </div>
  <div class="next-banner">
    <span class="next-label">NEXT</span>
    <span class="next-dot"></span>
    <span class="next-text">BLUE</span>
  </div>
  <div class="board" id="board"></div>
  <div class="combo-badge">combo <b>×4</b></div>
  <div class="popup">+90</div>
  <div class="footer-stats">
    <div class="stat-pill">obs <b>23</b></div>
    <div class="stat-pill">match <b>8</b></div>
    <div class="stat-pill">streak <b>×4</b></div>
  </div>
</div>
<script>
  const state = [
    'sR','sB','oY','oY','oY',
    'sB','sB','sB','sR','sY',
    'oR','sB','sR','sY','sB',
    'sB','sR','sB','oR','sB',
    'sY','sB','sR','sB','sR',
  ];
  const board = document.getElementById('board');
  const pip = { R: 'var(--r)', B: 'var(--b)', Y: 'var(--y)' };
  state.forEach(s => {
    const c = document.createElement('div');
    c.className = 'cell';
    const kind = s[0], color = s[1];
    if (kind === 's') {
      c.classList.add('super');
      c.style.setProperty('--pip', pip[color]);
      if (color === 'B') c.classList.add('picks-next');
    } else {
      c.classList.add('observed');
      c.dataset.color = color.toLowerCase();
    }
    board.appendChild(c);
  });
</script>
</body>
</html>
