<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup — Paper Craft</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --r: #e85a5a;
    --b: #5a8fde;
    --y: #e8b85a;
    --paper: #f5ead3;
    --paper-dark: #d4c3a0;
    --ink: #3a2e1f;
    --shadow: rgba(60, 40, 20, 0.25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: 'Patrick Hand', sans-serif;
    background:
      radial-gradient(circle at 30% 20%, #ffe9b8, transparent 50%),
      #e8d8a8;
    color: var(--ink);
    display: grid; place-items: center;
    padding: 24px;
  }
  /* Subtle paper texture via repeating noise */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      repeating-linear-gradient(45deg, transparent 0 2px, rgba(60,40,20,0.015) 2px 3px),
      repeating-linear-gradient(-45deg, transparent 0 3px, rgba(60,40,20,0.015) 3px 4px);
    pointer-events: none;
  }
  .phone {
    width: 390px; height: 844px;
    border-radius: 18px;
    background: var(--paper);
    overflow: hidden;
    position: relative;
    padding: 20px;
    display: flex; flex-direction: column;
    box-shadow:
      0 30px 60px var(--shadow),
      0 0 0 1px var(--paper-dark);
  }
  /* Paper grain */
  .phone::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(60,40,20,0.05) 0%, transparent 8%),
      radial-gradient(circle at 70% 60%, rgba(60,40,20,0.04) 0%, transparent 6%),
      radial-gradient(circle at 50% 90%, rgba(60,40,20,0.03) 0%, transparent 10%);
    pointer-events: none;
  }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; position: relative; }
  .title {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 36px;
    color: var(--ink);
    transform: rotate(-2deg);
  }
  .title::after {
    content: "";
    display: block;
    width: 80%;
    height: 4px;
    background: var(--r);
    border-radius: 4px;
    margin-top: -8px;
    margin-left: 8px;
    transform: rotate(1deg);
  }
  .menu-btn {
    width: 40px; height: 40px;
    background: white;
    border: 2px solid var(--ink);
    border-radius: 8px;
    display: grid; place-items: center;
    font-size: 18px;
    transform: rotate(2deg);
    box-shadow: 3px 3px 0 var(--ink);
  }
  .score-card {
    background: white;
    border: 2px solid var(--ink);
    border-radius: 12px;
    padding: 12px 18px;
    margin-bottom: 12px;
    position: relative;
    transform: rotate(-1deg);
    box-shadow: 4px 4px 0 var(--ink);
  }
  .score-label {
    font-family: 'Caveat';
    font-size: 18px;
    color: var(--r);
    transform: rotate(-1deg);
    display: inline-block;
  }
  .score-value {
    font-family: 'Caveat';
    font-weight: 700;
    font-size: 44px;
    color: var(--ink);
    line-height: 1;
  }
  .score-row { display: flex; justify-content: space-between; align-items: flex-end; }
  .best { font-family: 'Caveat'; font-size: 18px; color: var(--b); }
  .next-banner {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; padding: 10px 20px;
    background: white;
    border: 2px solid var(--ink);
    border-radius: 999px;
    margin-bottom: 12px;
    transform: rotate(1deg);
    box-shadow: 4px 4px 0 var(--ink);
  }
  .next-label { font-family: 'Caveat'; font-size: 16px; color: var(--y); font-weight: 700; }
  .next-dot {
    width: 22px; height: 22px;
    background: var(--b);
    border: 2px solid var(--ink);
    border-radius: 50%;
    box-shadow: 2px 2px 0 var(--ink);
  }
  .next-text {
    font-family: 'Caveat';
    font-weight: 700;
    font-size: 22px;
    color: var(--b);
  }
  .combo-badge {
    position: absolute; top: 220px; right: 24px;
    padding: 8px 14px;
    background: var(--y);
    color: var(--ink);
    font-family: 'Caveat';
    font-weight: 700;
    font-size: 18px;
    border: 2px solid var(--ink);
    border-radius: 8px;
    transform: rotate(-8deg);
    box-shadow: 4px 4px 0 var(--ink);
    z-index: 5;
  }
  .board {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 6px;
    padding: 10px;
    background: white;
    border: 2px solid var(--ink);
    border-radius: 16px;
    min-height: 0;
    box-shadow: 5px 5px 0 var(--ink);
    transform: rotate(-0.5deg);
  }
  .cell {
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 8px;
    position: relative;
    display: grid; place-items: center;
  }
  .cell.super { transform: rotate(-1deg); }
  .cell.super:nth-child(3n) { transform: rotate(1deg); }
  .cell.super:nth-child(5n) { transform: rotate(-2deg); }
  .cell.super::after {
    content: "";
    width: 36%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--pip);
    border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
  }
  .cell.observed {
    background: var(--obs);
    transform: rotate(2deg);
    box-shadow: 2px 2px 0 var(--ink);
  }
  .cell.observed:nth-child(2n) { transform: rotate(-2deg); }
  .cell.observed:nth-child(3n) { transform: rotate(1deg); }
  .cell.observed[data-color="r"] { --obs: var(--r); }
  .cell.observed[data-color="b"] { --obs: var(--b); }
  .cell.observed[data-color="y"] { --obs: var(--y); }
  .cell.picks-next {
    border-color: var(--b);
    border-width: 3px;
    box-shadow: 3px 3px 0 var(--b);
  }
  .cell.picks-next::after {
    animation: wobble 0.6s ease-in-out infinite alternate;
  }
  @keyframes wobble {
    from { transform: rotate(-4deg) scale(1); }
    to   { transform: rotate(4deg) scale(1.1); }
  }
  .popup {
    position: absolute;
    top: 340px; left: 50%;
    transform: translateX(-50%) rotate(-4deg);
    font-family: 'Caveat';
    font-weight: 700;
    font-size: 56px;
    color: var(--r);
    text-shadow: 4px 4px 0 var(--ink);
    pointer-events: none;
    z-index: 5;
  }
  .doodle {
    position: absolute;
    top: 60px; right: 30px;
    font-family: 'Caveat';
    font-size: 16px;
    color: var(--ink);
    transform: rotate(8deg);
    opacity: 0.6;
  }
  .footer-stats { display: flex; justify-content: space-between; margin-top: 12px; padding: 0 8px; }
  .stat-pill {
    font-family: 'Caveat';
    font-size: 18px;
    color: var(--ink);
  }
  .stat-pill b { color: var(--r); font-weight: 700; }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="title">Quantum Stack</div>
    <div class="menu-btn">≡</div>
  </div>
  <div class="doodle">↗ tap me!</div>
  <div class="score-card">
    <div class="score-label">score</div>
    <div class="score-row">
      <div class="score-value">1,240</div>
      <div class="best">best 5,820</div>
    </div>
  </div>
  <div class="next-banner">
    <span class="next-label">next →</span>
    <span class="next-dot"></span>
    <span class="next-text">blue!</span>
  </div>
  <div class="board" id="board"></div>
  <div class="combo-badge">x4 combo!</div>
  <div class="popup">+90!</div>
  <div class="footer-stats">
    <div class="stat-pill">관측 <b>23</b></div>
    <div class="stat-pill">매치 <b>8</b></div>
  </div>
</div>
<script>
  const state = [
    'sR','sB','oY','oY','oY',
    'sB','sB','sB','sR','sY',
    'oR','sB','sR','sY','sB',
    'sB','sR','sB','oR','sB',
    'sY','sB','sR','sB','sR',
  ];
  const board = document.getElementById('board');
  const pip = { R: 'var(--r)', B: 'var(--b)', Y: 'var(--y)' };
  state.forEach(s => {
    const c = document.createElement('div');
    c.className = 'cell';
    const kind = s[0], color = s[1];
    if (kind === 's') {
      c.classList.add('super');
      c.style.setProperty('--pip', pip[color]);
      if (color === 'B') c.classList.add('picks-next');
    } else {
      c.classList.add('observed');
      c.dataset.color = color.toLowerCase();
    }
    board.appendChild(c);
  });
</script>
</body>
</html>
