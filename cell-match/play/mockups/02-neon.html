<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup — Neon Cyberpunk</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Audiowide&display=swap" rel="stylesheet">
<style>
  :root {
    --r: #ff2a6d;
    --b: #05d9ff;
    --y: #f9f871;
    --bg: #0a0014;
    --grid-line: rgba(255, 42, 109, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: 'Orbitron', sans-serif;
    background: var(--bg);
    color: #fff;
    display: grid; place-items: center;
    padding: 24px;
    overflow: hidden;
  }
  .phone {
    width: 390px; height: 844px;
    border-radius: 28px;
    background:
      linear-gradient(180deg, rgba(255,42,109,0.04), transparent 30%, rgba(5,217,255,0.04)),
      repeating-linear-gradient(0deg, transparent 0, transparent 3px, rgba(5,217,255,0.04) 3px, rgba(5,217,255,0.04) 4px),
      #0a0014;
    overflow: hidden;
    position: relative;
    padding: 20px;
    display: flex; flex-direction: column;
    box-shadow:
      0 0 60px rgba(255,42,109,0.4),
      0 0 120px rgba(5,217,255,0.2),
      inset 0 0 0 2px var(--r);
  }
  .phone::before {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent 0, transparent 2px,
      rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 3px
    );
    pointer-events: none;
    z-index: 1;
  }
  .phone::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 28px;
    border: 2px solid var(--b);
    pointer-events: none;
    box-shadow: inset 0 0 30px rgba(5,217,255,0.3), 0 0 20px rgba(5,217,255,0.5);
    animation: borderGlitch 4s steps(1) infinite;
    z-index: 2;
  }
  @keyframes borderGlitch {
    0%, 100% { transform: translate(0, 0); }
    20%      { transform: translate(-1px, 1px); }
    40%      { transform: translate(1px, 0); }
    60%      { transform: translate(0, -1px); }
  }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; position: relative; z-index: 3; }
  .title {
    font-family: 'Audiowide', sans-serif;
    font-size: 22px;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 4px;
    text-shadow:
      2px 0 var(--r),
      -2px 0 var(--b),
      0 0 12px rgba(255,255,255,0.5);
    animation: chromatic 3s ease-in-out infinite;
  }
  @keyframes chromatic {
    0%, 100% { text-shadow: 2px 0 var(--r), -2px 0 var(--b), 0 0 12px rgba(255,255,255,0.5); }
    50%      { text-shadow: -2px 0 var(--r), 2px 0 var(--b), 0 0 12px rgba(255,255,255,0.5); }
  }
  .menu-btn {
    width: 40px; height: 40px;
    border: 2px solid var(--y);
    background: transparent;
    color: var(--y);
    display: grid; place-items: center;
    font-size: 18px;
    box-shadow: 0 0 12px rgba(249,248,113,0.5);
  }
  .score-card {
    padding: 12px 16px;
    border: 2px solid var(--r);
    background: rgba(255,42,109,0.06);
    margin-bottom: 12px;
    position: relative; z-index: 3;
    box-shadow: 0 0 20px rgba(255,42,109,0.3), inset 0 0 20px rgba(255,42,109,0.1);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  .score-label { font-size: 9px; color: var(--b); letter-spacing: 3px; }
  .score-value {
    font-family: 'Audiowide';
    font-size: 38px;
    color: #fff;
    text-shadow: 0 0 16px var(--r), 0 0 32px var(--r);
    line-height: 1;
    letter-spacing: 2px;
  }
  .score-row { display: flex; justify-content: space-between; align-items: flex-end; }
  .best { color: var(--b); font-size: 12px; text-shadow: 0 0 8px var(--b); }
  .next-banner {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; padding: 10px;
    border: 2px solid var(--b);
    background: rgba(5,217,255,0.08);
    margin-bottom: 12px;
    position: relative; z-index: 3;
    box-shadow: 0 0 18px rgba(5,217,255,0.4);
  }
  .next-label { font-size: 10px; color: var(--y); letter-spacing: 3px; }
  .next-dot {
    width: 18px; height: 18px;
    background: var(--b);
    box-shadow: 0 0 18px var(--b), 0 0 36px var(--b);
    animation: dotBlink 0.8s ease-in-out infinite alternate;
  }
  @keyframes dotBlink {
    from { opacity: 0.7; }
    to   { opacity: 1; }
  }
  .next-text {
    font-family: 'Audiowide';
    font-size: 18px;
    color: var(--b);
    text-shadow: 0 0 10px var(--b);
    letter-spacing: 2px;
  }
  .combo-badge {
    position: absolute; top: 220px; right: 22px;
    padding: 6px 14px;
    background: var(--y);
    color: #000;
    font-family: 'Audiowide';
    font-size: 14px;
    letter-spacing: 2px;
    box-shadow: 0 0 20px var(--y), 4px 4px 0 var(--r);
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    z-index: 4;
  }
  .board {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 5px;
    padding: 10px;
    border: 2px solid var(--r);
    background:
      linear-gradient(rgba(255,42,109,0.04), rgba(5,217,255,0.04)),
      #050010;
    position: relative; z-index: 3;
    box-shadow: inset 0 0 30px rgba(255,42,109,0.2), 0 0 30px rgba(255,42,109,0.3);
    min-height: 0;
  }
  .cell {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    position: relative;
    display: grid; place-items: center;
  }
  .cell.super::after {
    content: "";
    width: 28%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--pip);
    box-shadow: 0 0 12px var(--pip), 0 0 24px var(--pip);
  }
  .cell.observed {
    background: var(--obs);
    box-shadow: inset 0 0 14px rgba(255,255,255,0.4), 0 0 18px var(--obs-shadow);
    animation: cellFlicker 3s steps(1) infinite;
  }
  .cell.observed[data-color="r"] { --obs: var(--r); --obs-shadow: rgba(255,42,109,0.7); }
  .cell.observed[data-color="b"] { --obs: var(--b); --obs-shadow: rgba(5,217,255,0.7); }
  .cell.observed[data-color="y"] { --obs: var(--y); --obs-shadow: rgba(249,248,113,0.7); }
  @keyframes cellFlicker {
    0%, 95%, 100% { opacity: 1; }
    97%           { opacity: 0.6; }
  }
  .cell.picks-next {
    border-color: var(--b);
    box-shadow: 0 0 0 1px var(--b), 0 0 20px var(--b), inset 0 0 14px rgba(5,217,255,0.3);
  }
  .popup {
    position: absolute;
    top: 360px; left: 50%;
    transform: translateX(-50%) skewX(-12deg);
    font-family: 'Audiowide';
    font-size: 56px;
    color: var(--y);
    text-shadow:
      4px 0 var(--r),
      -4px 0 var(--b),
      0 0 24px rgba(249,248,113,0.8);
    letter-spacing: 2px;
    pointer-events: none;
    z-index: 5;
    animation: glitchPop 2s steps(1) infinite;
  }
  @keyframes glitchPop {
    0%, 88%, 100% { transform: translateX(-50%) skewX(-12deg); }
    90%           { transform: translateX(-48%) skewX(-12deg); }
    92%           { transform: translateX(-52%) skewX(-12deg) translateY(2px); }
  }
  .footer-stats { display: flex; justify-content: space-between; margin-top: 10px; position: relative; z-index: 3; padding: 0 4px; }
  .stat-pill {
    font-family: 'Orbitron';
    font-size: 11px;
    color: var(--b);
    letter-spacing: 2px;
  }
  .stat-pill b { color: var(--y); font-size: 14px; text-shadow: 0 0 8px var(--y); }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="title">// QUANTUM_STACK</div>
    <div class="menu-btn">≡</div>
  </div>
  <div class="score-card">
    <div class="score-label">>> SCORE</div>
    <div class="score-row">
      <div class="score-value">1,240</div>
      <div class="best">BEST: 5,820</div>
    </div>
  </div>
  <div class="next-banner">
    <span class="next-label">>> TARGET</span>
    <span class="next-dot"></span>
    <span class="next-text">CYAN</span>
  </div>
  <div class="board" id="board"></div>
  <div class="combo-badge">x4 CHAIN</div>
  <div class="popup">+90</div>
  <div class="footer-stats">
    <div class="stat-pill">OBS <b>23</b></div>
    <div class="stat-pill">MATCH <b>8</b></div>
    <div class="stat-pill">DEPTH <b>04</b></div>
  </div>
</div>
<script>
  const state = [
    'sR','sB','oY','oY','oY',
    'sB','sB','sB','sR','sY',
    'oR','sB','sR','sY','sB',
    'sB','sR','sB','oR','sB',
    'sY','sB','sR','sB','sR',
  ];
  const board = document.getElementById('board');
  const pip = { R: 'var(--r)', B: 'var(--b)', Y: 'var(--y)' };
  state.forEach(s => {
    const c = document.createElement('div');
    c.className = 'cell';
    const kind = s[0], color = s[1];
    if (kind === 's') {
      c.classList.add('super');
      c.style.setProperty('--pip', pip[color]);
      if (color === 'B') c.classList.add('picks-next');
    } else {
      c.classList.add('observed');
      c.dataset.color = color.toLowerCase();
    }
    board.appendChild(c);
  });
</script>
</body>
</html>
