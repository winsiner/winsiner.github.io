</noscript>
<script>
(function() {
  var SUPPORTED = ["en","ko","ja","zh-Hans","zh-Hant","es","pt-BR","fr","de","it","tr","id"];
  var DEFAULT_LANG = 'en';
  function pick() {
    try {
      var langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
      for (var i = 0; i < langs.length; i++) {
        var raw = (langs[i] || '').toLowerCase();
        if (!raw) continue;
        if (raw.indexOf('zh-tw') === 0 || raw.indexOf('zh-hk') === 0 || raw.indexOf('zh-mo') === 0 || raw.indexOf('zh-hant') === 0) {
          if (SUPPORTED.indexOf('zh-Hant') >= 0) return 'zh-Hant';
        }
        if (raw.indexOf('zh') === 0) {
          if (SUPPORTED.indexOf('zh-Hans') >= 0) return 'zh-Hans';
        }
        if (raw.indexOf('pt') === 0) {
          if (SUPPORTED.indexOf('pt-BR') >= 0) return 'pt-BR';
        }
        var base = raw.split('-')[0];
        if (SUPPORTED.indexOf(base) >= 0) return base;
        if (SUPPORTED.indexOf(raw) >= 0) return raw;
      }
    } catch (_) {}
    return DEFAULT_LANG;
  }
  var target = pick();
  // Preserve query string + hash (for /?score=N pasted into root by mistake)
  var qs = window.location.search || '';
  var hash = window.location.hash || '';
  window.location.replace('./' + target + '/' + qs + hash);
})();
</script>
